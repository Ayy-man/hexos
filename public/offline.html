<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - hexOS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
      line-height: 1.6;
    }

    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    button:active {
      transform: translateY(0);
    }

    .cached-pages {
      margin-top: 40px;
      text-align: left;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .cached-pages h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .cached-pages ul {
      list-style: none;
    }

    .cached-pages li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .cached-pages li:last-child {
      border-bottom: none;
    }

    .cached-pages a {
      color: white;
      text-decoration: none;
      display: block;
      transition: opacity 0.2s;
    }

    .cached-pages a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Some features are limited, but you can still browse cached pages.</p>

    <button onclick="location.reload()">Try Again</button>

    <div class="cached-pages">
      <h2>Available Offline:</h2>
      <ul>
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/conversations">Conversations</a></li>
        <li><a href="/pulse">Pulse</a></li>
        <li><a href="/notifications">Notifications</a></li>
      </ul>
    </div>
  </div>

  <script>
    // Auto-retry when online
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
